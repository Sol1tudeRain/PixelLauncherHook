plugins { id 'com.android.application' }

def signingFile = System.getenv('LAUNCHER_SIGNING_KEYSTORE')
def signingPassword = System.getenv('LAUNCHER_SIGNING_PASSWORD')
def hasStableSigning = signingFile != null && !signingFile.isEmpty() && signingPassword != null && !signingPassword.isEmpty()

android {
    namespace 'dev.local.launcherdoubletap'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.local.launcherdoubletap'
        minSdk 31
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }
    signingConfigs {
        if (hasStableSigning) {
            stable {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias 'launcherhook'
                keyPassword signingPassword
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82' }
