name: Build Pixel Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test double-tap state machine
        run: bash tests/run.sh
      - name: Verify Android sources compile
        run: gradle --no-daemon :app:assembleDebug
      - name: Load optional stable-signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LAUNCHER_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/launcherhook-signing.p12"
            echo "LAUNCHER_SIGNING_KEYSTORE=$RUNNER_TEMP/launcherhook-signing.p12" >> "$GITHUB_ENV"
            echo "LAUNCHER_SIGNING_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo 'Private signing secrets absent; publish unsigned build for local fixed-key signing.'
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi
      - name: Build release
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify stable signing certificate
        if: env.STABLE_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          EXPECTED=da11dc91385a561fb014911aac165a6ea7b501c353aa3147367dc769404c9709
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo '::error::APK certificate does not match the locked v1.1 signing key.'
            exit 1
          fi
      - name: Upload stable-signed APK
        if: env.STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PixelLauncherHook-stable-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Collect unsigned APK for private local signing
        if: env.STABLE_SIGNING != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-transfer
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-transfer/unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-transfer/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" build-transfer/zipalign
      - name: Upload unsigned APK and signing tools
        if: env.STABLE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PixelLauncherHook-unsigned-build
          path: build-transfer/
          if-no-files-found: error
      - name: Clear signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/launcherhook-signing.p12"
